# Devyn's content editor at /admin/ — Sveltia CMS
# GitHub backend, token sign-in only (she pastes her editing key once;
# Sveltia keeps it in the browser). __REPO__ is stamped by build.js.
backend:
  name: github
  repo: __REPO__
  branch: main
  auth_methods: [token]

# Local review without login: the editor offers "Work with Local Repository"
# in Chrome, or run: npx decap-server
local_backend: true

site_url: https://www.devynunderwater.com
logo_url: https://kevin-mentatix.github.io/devynunderwater/assets/img/logo-white.png

media_folder: "uploads"
public_folder: "/uploads"

collections:
  # ─────────── PHOTOS: one card per photo ───────────
  - name: photos
    label: "Photos"
    label_singular: "Photo"
    folder: "content/photos"
    extension: json
    format: json
    create: true
    identifier_field: title
    summary: "{{title}}"
    thumbnail: image
    sortable_fields: [title, set, heroOrder, saleOrder]
    view_groups:
      - { label: "Collection", field: set }
      - { label: "For sale", field: forSale }
    fields:
      - { label: "Title", name: title, widget: string }
      - label: "Collection"
        name: set
        widget: select
        options:
          - { label: "2023–24 Season", value: s24 }
          - { label: "2024–25 Season", value: s25 }
          - { label: "2026 Season", value: s26 }
        hint: "Which gallery filter this photo appears under"
      - { label: "Image (upload your JPG — new photos only)", name: image, widget: image, required: false, hint: "Existing photos already have their image on the site; leave empty unless replacing." }
      - { label: "Hero slideshow position (blank = not in slideshow)", name: heroOrder, widget: number, required: false, value_type: int, min: 1 }
      - { label: "Homepage featured strip position (blank = not featured)", name: featuredOrder, widget: number, required: false, value_type: int, min: 1 }
      - { label: "Sell as a print?", name: forSale, widget: boolean, required: false, default: false }
      - { label: "Print story (shown on its shop page)", name: story, widget: text, required: false, hint: "Only used when selling" }
      - { label: "Fine Art America artwork URL", name: faaUrl, widget: string, required: false, default: "", hint: "Paste from your FAA account — buy buttons appear automatically" }
      - { label: "Shop position", name: saleOrder, widget: number, required: false, value_type: int, min: 1 }
      - { label: "Web address (auto — leave alone)", name: slug, widget: string, required: false }

  # ─────────── SITE SETTINGS ───────────
  - name: settings
    label: "Site Settings & Copy"
    files:
      - name: main
        label: "Copy, links & homepage"
        file: "data/site.json"
        fields:
          - { label: "Hero headline", name: heroLine, widget: string }
          - { label: "Hero subline", name: heroSub, widget: string }
          - label: "Page copy"
            name: copy
            widget: object
            fields:
              - { label: "Homepage about teaser", name: aboutTeaser, widget: text }
              - { label: "About page intro", name: aboutLong, widget: text }
              - { label: "Shop intro", name: shopIntro, widget: text }
          - label: "Homepage section images (photo names from the Photos list)"
            name: homeImages
            widget: object
            fields:
              - { label: "My History section", name: history, widget: string }
              - { label: "Prints section", name: shop, widget: string }
              - { label: "Contact section", name: contact, widget: string }
              - { label: "About page", name: aboutMedia, widget: string }
          - label: "Gallery collections (the filter buttons)"
            name: collections
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Id (short, no spaces — used on photos)", name: id, widget: string }
              - { label: "Name", name: name, widget: string }
              - { label: "Where (optional)", name: where, widget: string, required: false, default: "" }
              - { label: "Year", name: year, widget: string }
              - { label: "Blurb (About page)", name: blurb, widget: text }
          - { label: "Contact email", name: email, widget: string, required: false, default: "" }
          - label: "Social links"
            name: socials
            widget: object
            fields:
              - { label: "Instagram URL", name: instagram, widget: string, required: false, default: "" }
              - { label: "TikTok URL", name: tiktok, widget: string, required: false, default: "" }
              - { label: "Facebook URL", name: facebook, widget: string, required: false, default: "" }
          - label: "Fine Art America"
            name: faa
            widget: object
            fields:
              - { label: "Your FAA artist page URL", name: artistUrl, widget: string, required: false, default: "" }
              - { label: "Note", name: note, widget: string, required: false }
          - label: "Print media types shown in the shop"
            name: printMedia
            widget: list
            field: { label: "Type", name: m, widget: string }
          # fixed config — visible but rarely touched
          - { label: "Site name", name: name, widget: string }
          - { label: "Domain", name: domain, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - label: "Theme colors (managed by your site team)"
            name: colors
            widget: object
            collapsed: true
            fields:
              - { label: "light", name: light, widget: string }
              - { label: "gray", name: gray, widget: string }
              - { label: "navy", name: navy, widget: string }
              - { label: "teal", name: teal, widget: string }
              - { label: "tealDeep", name: tealDeep, widget: string }
