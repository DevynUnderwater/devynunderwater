# Decap CMS — Devyn's content editor at /admin/
#
# AUTH (one-time, Kevin): once hosted on Netlify, switch to the git-gateway
# backend (commented below) + enable Identity, then invite Devyn by email.
# Until then the github backend needs an OAuth app (see README).
backend:
  name: github
  repo: Kevin-Mentatix/devynunderwater
  branch: main
# backend:
#   name: git-gateway
#   branch: main

# For local testing without auth: npx decap-server  (then open /admin/)
local_backend: true

site_url: https://www.devynunderwater.com
logo_url: https://kevin-mentatix.github.io/devynunderwater/assets/img/logo-white.png

media_folder: "uploads"
public_folder: "/uploads"

collections:
  - name: site
    label: "Website Content"
    files:
      - name: main
        label: "All content (photos, shop, copy)"
        file: "data/site.json"
        fields:
          # ---------- photos ----------
          - label: "Photo Gallery"
            name: gallery
            widget: list
            summary: "{{fields.title}} ({{fields.set}})"
            hint: "Add a photo: upload the image (JPG straight from Lightroom is perfect), give it a title, pick a collection. Existing photos are listed by title — edit titles freely; leave their Id alone."
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "Collection", name: set, widget: string, hint: "Must match a Collection id below (e.g. s24, s25, s26)" }
              - { label: "Upload image (new photos only)", name: image, widget: image, required: false }
              - { label: "Id (auto — don't edit)", name: id, widget: string, required: false }
          - label: "Collections (the gallery filters)"
            name: collections
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { label: "Id (short, no spaces)", name: id, widget: string }
              - { label: "Name (filter button)", name: name, widget: string }
              - { label: "Where (optional)", name: where, widget: string, required: false, default: "" }
              - { label: "Year", name: year, widget: string }
              - { label: "Blurb (About page)", name: blurb, widget: text }
          - label: "Hero slideshow (photo ids, in order)"
            name: heroSlides
            widget: list
            field: { label: "Photo id", name: slide, widget: string }
            hint: "The rotating photos at the top of the homepage. Use ids from the gallery (shown in each photo's Id field)."
          - label: "Homepage featured strip (photo ids)"
            name: featured
            widget: list
            field: { label: "Photo id", name: item, widget: string }
          - label: "Homepage section images"
            name: homeImages
            widget: object
            collapsed: true
            fields:
              - { label: "My History photo id", name: history, widget: string }
              - { label: "Prints section photo id", name: shop, widget: string }
              - { label: "Contact section photo id", name: contact, widget: string }
              - { label: "About page photo id", name: aboutMedia, widget: string }
          # ---------- shop ----------
          - label: "Print Shop products"
            name: products
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: "Title", name: title, widget: string }
              - { label: "URL slug (no spaces)", name: slug, widget: string }
              - { label: "Photo id", name: img, widget: string }
              - { label: "Story (shown on the product page)", name: story, widget: text }
              - { label: "Fine Art America artwork URL", name: faaUrl, widget: string, required: false, default: "", hint: "Paste the artwork's page from your FAA account — buy buttons appear automatically" }
          - label: "Print media types shown"
            name: printMedia
            widget: list
            field: { label: "Type", name: m, widget: string }
          # ---------- copy ----------
          - { label: "Hero headline", name: heroLine, widget: string }
          - { label: "Hero subline", name: heroSub, widget: string }
          - label: "Page copy"
            name: copy
            widget: object
            fields:
              - { label: "Homepage about teaser", name: aboutTeaser, widget: text }
              - { label: "About page intro", name: aboutLong, widget: text }
              - { label: "Shop intro", name: shopIntro, widget: text }
          # ---------- contact & links ----------
          - { label: "Contact email", name: email, widget: string, required: false, default: "" }
          - label: "Social links"
            name: socials
            widget: object
            fields:
              - { label: "Instagram URL", name: instagram, widget: string, required: false, default: "" }
              - { label: "Facebook URL", name: facebook, widget: string, required: false, default: "" }
          - label: "Fine Art America"
            name: faa
            widget: object
            fields:
              - { label: "Your FAA artist page URL", name: artistUrl, widget: string, required: false, default: "" }
              - { label: "Note", name: note, widget: string, required: false }
          # ---------- fixed site config (leave alone) ----------
          - { label: "Site name", name: name, widget: string }
          - { label: "Domain", name: domain, widget: string }
          - { label: "Tagline", name: tagline, widget: string }
          - label: "Theme colors (managed by your site team)"
            name: colors
            widget: object
            collapsed: true
            fields:
              - { label: "light", name: light, widget: string }
              - { label: "gray", name: gray, widget: string }
              - { label: "navy", name: navy, widget: string }
              - { label: "teal", name: teal, widget: string }
              - { label: "tealDeep", name: tealDeep, widget: string }
