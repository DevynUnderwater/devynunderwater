[build]
  # RETIRED HOST: production moved to GitHub Pages (see .github/workflows/).
  # ignore always exits 0 → Netlify skips every build (0 credits). The last
  # deploy stays frozen to serve Identity/Git Gateway/Forms during handoff.
  ignore = "exit 0"
  command = "if git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- uploads content static/img 2>/dev/null; then node build.js; else pip install pillow && python3 prep-ci.py && node build.js; fi"
  publish = "site"

[functions]
  directory = "netlify/functions"

[build.environment]
  PYTHON_VERSION = "3.12"
  NODE_VERSION = "22"
